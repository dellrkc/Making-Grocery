<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c63ff">
</head>
<body>

<div class="app">

    <div class="top-bar">
        <button onclick="toggleDarkMode()" class="toggle-btn">🌙</button>
        <h1>🛒 Grocery List</h1>
    </div>

    <a href="calendar.html" class="nav-btn">📅 View History</a>

    <!-- INPUT CARD -->
    <div class="input-card">
        <input type="text" id="item" placeholder="Add grocery item" />

        <div class="input-row">
            <input type="number" id="itemPrice" placeholder="Price ($)" min="0" step="0.01" />
            <input type="url" id="itemLink" placeholder="Optional link" />
        </div>

        <button onclick="addItem()" class="add-btn">+ Add Item</button>
    </div>

    <div class="total-bar">
        Total: <strong id="totalPrice">$0.00</strong>
    </div>

    <ul id="list"></ul>

    <button onclick="saveList()" class="save-btn">📦 Save List</button>

</div>

<script src="script.js"></script>

</body>
</html>
