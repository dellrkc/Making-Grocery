<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <div class="top-bar">
        <button onclick="toggleDarkMode()" class="toggle-btn">🌙</button>
        <h1>🛒 Grocery List</h1>
    </div>

    <a href="calendar.html" class="nav-btn">📅 View History</a>

    <div class="input-row">
        <input type="text" id="item" placeholder="Item name" />
    </div>
    <div class="input-row">
        <input type="number" id="itemPrice" placeholder="Price (optional)" min="0" step="0.01" />
        <input type="url" id="itemLink" placeholder="Link (optional)" />
    </div>

    <button onclick="addItem()" class="add-btn">+ Add Item</button>
    <button onclick="saveList()" class="save-btn">📦 Save List</button>

    <div class="total-bar">
        Total: <strong id="totalPrice">$0.00</strong>
    </div>

    <ul id="list"></ul>

</div>
<script defer src="script.js"></script>
</body>
</html>
