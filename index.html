<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <button onclick="toggleDarkMode()" class="toggle-btn">🌙</button>

    <h1>🛒 Grocery List</h1>

    <div class="input">
        <input type="text" id="item" placeholder="Add grocery item">
        <button onclick="addItem()">+</button>
    </div>

    <button onclick="saveList()" class="save-btn">📦 Save List</button>

    <ul id="list"></ul>

    <div class="history-section">
        <h3>📜 Past Lists</h3>
        <ul id="history"></ul>
    </div>

</div>

<script defer src="script.js"></script>

</body>
</html>
