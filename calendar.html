<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="header">
        <a href="index.html" class="back-link">⬅ Back</a>
        <h1>📅 Grocery History</h1>
    </div>
    <ul id="calendarList" class="scroll-area"></ul>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-content">

        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2>🛒 Full List</h2>

        <div id="modalMeta" class="modal-meta"></div>
        <div id="modalItems"></div>
        <div id="modalTotal" class="modal-total"></div>

        <button onclick="shareList()" class="share-btn">🔗 Share List</button>
        <button id="editBtn" onclick="editList()" class="save-btn" style="display:none;">✏️ Edit List</button>
        <button onclick="deleteList()" class="delete-btn">🗑️ Delete List</button>

    </div>
</div>

<script>
let selectedIndex = null;

document.addEventListener("DOMContentLoaded", () => { renderList(); });

function renderList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    const container = document.getElementById("calendarList");
    container.innerHTML = "";

    if (lists.length === 0) {
        container.innerHTML = "<p class='empty-msg'>No saved lists yet.</p>";
        return;
    }

    lists.forEach((list, index) => {
        const li = document.createElement("li");
        const previewItems = list.items.slice(0, 3);
        let previewHTML = previewItems.map(i => `• ${i.text}`).join("<br>");
        if (list.items.length > 3) previewHTML += "<br><span class='more'>+" + (list.items.length - 3) + " more</span>";

        const total = calcTotal(list.items);
        const dateLabel = list.updatedAt ? `Updated: ${list.updatedAt}` : `Created: ${list.createdAt}`;

        li.innerHTML = `
            <div class="history-card">
                <div class="history-left">
                    <div class="history-date">${dateLabel}</div>
                    <div class="history-preview">${previewHTML}</div>
                </div>
                <div class="history-total">$${total}</div>
            </div>`;
        li.onclick = () => openModal(index);
        container.appendChild(li);
    });
}

function calcTotal(items) {
    return items.reduce((sum, i) => sum + (parseFloat(i.price) || 0), 0).toFixed(2);
}

function openModal(index) {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    selectedIndex = index;
    const list = lists[index];

    document.getElementById("modalMeta").innerHTML =
        list.updatedAt ? `<span class="meta-label">Updated: ${list.updatedAt}</span>` :
                         `<span class="meta-label">Created: ${list.createdAt}</span>`;

    let fullHTML = list.items.map(item => {
        const price = item.price ? `<span class="item-price">$${parseFloat(item.price).toFixed(2)}</span>` : "";
        const link = item.link ? `<a href="${item.link}" target="_blank" class="item-link">🔗 Link</a>` : "";
        const done = item.done ? "line-through" : "none";
        return `<div class="modal-item" style="text-decoration:${done}">
                    <span>• ${item.text}</span>
                    <span class="item-extras">${price}${link}</span>
                </div>`;
    }).join("");

    document.getElementById("modalItems").innerHTML = fullHTML;
    document.getElementById("modalTotal").innerHTML = `<strong>Total: $${calcTotal(list.items)}</strong>`;
    document.getElementById("editBtn").style.display = "block";
    document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
}

function handleOverlayClick(e) {
    if (e.target === document.getElementById("modalOverlay")) closeModal();
}

function shareList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    if (selectedIndex === null) return;
    const list = lists[selectedIndex];

    const text = list.items.map(i => {
        let line = `• ${i.text}`;
        if (i.price) line += ` - $${parseFloat(i.price).toFixed(2)}`;
        if (i.link) line += ` (${i.link})`;
        return line;
    }).join("\n");

    const total = calcTotal(list.items);
    const shareText = `🛒 MakingGroceries\n\n${text}\n\nTotal: $${total}`;

    if (navigator.share) {
        navigator.share({
    title: "MakingGroceries 🛒",
    text: shareText
});
    } else {
        navigator.clipboard.writeText(shareText).then(() => {
            alert("List copied to clipboard!");
        });
    }
}

function editList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    if (selectedIndex === null) return;
    localStorage.setItem("currentList", JSON.stringify(lists[selectedIndex].items));
    localStorage.setItem("editingIndex", selectedIndex);
    window.location.href = "index.html";
}

function deleteList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    if (selectedIndex === null) return;
    if (!confirm("Delete this list?")) return;
    lists.splice(selectedIndex, 1);
    localStorage.setItem("lists", JSON.stringify(lists));
    closeModal();
    renderList();
}
</script>
</body>
</html>
