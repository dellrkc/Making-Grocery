<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <a href="index.html" class="nav-btn">⬅ Back</a>

    <h1>📅 Grocery History</h1>

    <!-- ✅ THIS IS REQUIRED (fixes your error) -->
    <ul id="calendarList"></ul>

</div>

<script>
/* ✅ WAIT UNTIL PAGE LOADS (fixes crash) */
document.addEventListener("DOMContentLoaded", () => {

    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    const container = document.getElementById("calendarList");

    /* safety check */
    if (!container) {
        console.error("calendarList not found");
        return;
    }

    lists.forEach(list => {
        const li = document.createElement("li");

        /* only first 3 items */
        const previewItems = list.items.slice(0, 3);

        let previewHTML = "";

        previewItems.forEach(item => {
            previewHTML += `• ${item.text}<br>`;
        });

        /* show ... if more */
        if (list.items.length > 3) {
            previewHTML += "...";
        }

        li.innerHTML = `
            <strong>${list.date}</strong><br>
            ${previewHTML}
        `;

        container.appendChild(li);
    });

});
</script>

</body>
</html>
