<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- 🔥 STICKY HEADER -->
    <div class="header">
        <a href="index.html" class="nav-btn">⬅ Back</a>
        <h1>📅 Grocery History</h1>
    </div>

    <!-- 📜 SCROLLABLE LIST -->
    <ul id="calendarList" class="scroll-area"></ul>

</div>

<!-- 🪟 MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">

        <span class="close-btn" onclick="closeModal()">❌</span>

        <h2>🛒 Full List</h2>

        <div id="modalItems"></div>

        <button onclick="editList()" class="save-btn">✏️ Edit List</button>
        <button onclick="deleteList()" class="delete-btn">🗑️ Delete List</button>

    </div>
</div>

<script>
let selectedIndex = null;

document.addEventListener("DOMContentLoaded", () => {

    let lists = JSON.parse(localStorage.getItem("lists")) || [];
    const container = document.getElementById("calendarList");

    lists.forEach((list, index) => {
        const li = document.createElement("li");

        const previewItems = list.items.slice(0, 3);

        let previewHTML = "";

        previewItems.forEach(item => {
            previewHTML += `• ${item.text}<br>`;
        });

        if (list.items.length > 3) {
            previewHTML += "...";
        }

        li.innerHTML = `
            <strong>${list.date}</strong><br>
            ${previewHTML}
        `;

        li.onclick = () => openModal(index);

        container.appendChild(li);
    });

});

/* 🪟 OPEN MODAL */
function openModal(index) {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];

    selectedIndex = index;

    const modal = document.getElementById("modal");
    const modalItems = document.getElementById("modalItems");

    const list = lists[index];

    let fullHTML = "";

    list.items.forEach(item => {
        fullHTML += `• ${item.text}<br>`;
    });

    modalItems.innerHTML = fullHTML;

    modal.style.display = "flex";
}

/* ❌ CLOSE */
function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* ✏️ EDIT */
function editList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];

    if (selectedIndex === null) return;

    const listToEdit = lists[selectedIndex];

    // send items
    localStorage.setItem("currentList", JSON.stringify(listToEdit.items));

    // 🔥 NEW: track which list we're editing
    localStorage.setItem("editingIndex", selectedIndex);

    window.location.replace("index.html");
}

/* 🗑️ DELETE */
function deleteList() {
    let lists = JSON.parse(localStorage.getItem("lists")) || [];

    if (selectedIndex === null) return;

    if (!confirm("Delete this list?")) return;

    lists.splice(selectedIndex, 1);

    localStorage.setItem("lists", JSON.stringify(lists));

    location.reload();
}
</script>

</body>
</html>
